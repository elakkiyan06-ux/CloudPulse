<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41C8F5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00D6A0" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A38" />
      <stop offset="100%" stop-color="#111822" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Subtle Cloud Silhouette Background -->
  <path d="M46 22a9 9 0 0 0-17.5-2.8A12 12 0 0 0 14 30a10 10 0 0 0 2 19.8h30a9 9 0 0 0 0-18c0-.6 0-1.2-.2-1.8A9 9 0 0 0 46 22z"
        fill="none" stroke="#273441" stroke-width="2" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Database Cylinder Body -->
  <!-- Top tier -->
  <path d="M22 20c0-3.3 4.5-6 10-6s10 2.7 10 6v6c0 3.3-4.5 6-10 6s-10-2.7-10-6v-6z" fill="url(#dbGrad)" stroke="#273441" stroke-width="1.5"/>
  <ellipse cx="32" cy="20" rx="10" ry="4" fill="#233242" stroke="#41C8F5" stroke-width="1.5"/>
  
  <!-- Middle tier -->
  <path d="M22 28c0 3.3 4.5 6 10 6s10-2.7 10-6v7c0 3.3-4.5 6-10 6s-10-2.7-10-6v-7z" fill="url(#dbGrad)" stroke="#273441" stroke-width="1.5"/>
  <!-- Bottom tier -->
  <path d="M22 37c0 3.3 4.5 6 10 6s10-2.7 10-6v7c0 3.3-4.5 6-10 6s-10-2.7-10-6v-7z" fill="url(#dbGrad)" stroke="#273441" stroke-width="1.5"/>

  <!-- Pulse Waveform crossing the database horizontally -->
  <path d="M6 34 L20 34 L24 23 L28 45 L32 28 L36 38 L40 34 L58 34"
        stroke="url(#cloudGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Pulse Active Marker Nodes -->
  <circle cx="28" cy="45" r="2.5" fill="#00D6A0" filter="url(#glow)"/>
  <circle cx="32" cy="28" r="2" fill="#41C8F5"/>
  <circle cx="6" cy="34" r="1.5" fill="#41C8F5"/>
  <circle cx="58" cy="34" r="1.5" fill="#00D6A0"/>
</svg>
