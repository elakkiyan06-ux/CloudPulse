version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cloudpulse_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cloudpulse_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/cloudpulse_local
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1/forecast
      AWS_REGION: ap-south-1
      ENVIRONMENT: local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
